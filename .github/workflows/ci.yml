name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    # Mesuré sur le run 33671092839 (tentative 2) : checkout + setup-node + npm ci (~49s)
    # + lint (30s) + build (50s) + tsc --noEmit (20s) ≈ 2min34s au total. Ce job ne touche
    # jamais Postgres — build/lint/typecheck ne dépendent pas de la base de test (le
    # serveur des tests utilise `next dev`, jamais le build de production). Marge large
    # (10 min) sans jamais se rapprocher du budget réel mesuré.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Test (groupe ${{ matrix.group }})
    needs: build-and-check
    runs-on: ubuntu-latest
    # 519s (8min39s) est la durée la plus longue mesurée à ce jour pour un groupe qui
    # termine normalement (run 33671092839, Groupe 2/6, 2 échecs fonctionnels réels, pas
    # un blocage) — 15 min laisse ~6min21s de marge au-dessus de cette valeur avant de
    # conclure à un blocage réel plutôt qu'une lenteur légitime. Propre à chaque entrée de
    # matrice : un groupe qui dépasse ce budget échoue seul, sans jamais consommer le
    # budget des cinq autres (voir `strategy.fail-fast` ci-dessous).
    timeout-minutes: 15

    strategy:
      # Obligatoire : la valeur par défaut de GitHub Actions (`fail-fast: true`) annule
      # automatiquement toutes les entrées de matrice encore en cours dès qu'une seule
      # échoue — exactement le comportement à éviter ici (un groupe en échec/blocage ne
      # doit jamais priver les cinq autres de leurs diagnostics).
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]

    # Conteneur PostgreSQL éphémère, propre à CETTE ENTRÉE DE MATRICE (donc à ce groupe) :
    # détruit avec le runner à la fin de l'exécution, jamais accessible depuis l'extérieur
    # de ce job, jamais partagé avec xrent_dev, un environnement de production (qui
    # n'existe d'ailleurs pas encore — CLAUDE.md section 1), ni avec les cinq autres
    # entrées de la matrice (chacune reçoit son propre runner et donc son propre service,
    # jamais partagé — GitHub Actions n'exécute jamais deux entrées de matrice sur le même
    # runner). Base nommée "xrent_test" par convention avec ARCHITECTURE.md/scripts/env-guard.js.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xrent_ci
          POSTGRES_PASSWORD: xrent_ci
          POSTGRES_DB: xrent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U xrent_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      # .env.test généré ici, jamais commité (comme en local : ce fichier n'est pas suivi par
      # git). Toutes les valeurs sont générées aléatoirement pour la durée de ce job uniquement
      # et ne servent qu'à faire démarrer l'application contre la base Postgres éphémère du
      # service ci-dessus — aucun secret réel, aucune valeur issue de GitHub Secrets. Elles ne
      # protègent rien de sensible : la base et le process qui les utilise n'existent plus une
      # fois le job terminé. Générées indépendamment par chaque entrée de la matrice (jamais
      # partagées entre groupes — aucun canal de communication entre jobs n'est nécessaire ni
      # souhaitable ici).
      - name: Create ephemeral .env.test
        run: |
          AUTH_SECRET_VALUE="$(openssl rand -base64 32)"
          CRON_SECRET_VALUE="$(openssl rand -base64 32)"
          MFA_KEY_VALUE="$(openssl rand -base64 32)"
          echo "::add-mask::$AUTH_SECRET_VALUE"
          echo "::add-mask::$CRON_SECRET_VALUE"
          echo "::add-mask::$MFA_KEY_VALUE"
          cat > .env.test <<EOF
          DATABASE_URL="postgresql://xrent_ci:xrent_ci@localhost:5432/xrent_test?schema=public"
          AUTH_SECRET="${AUTH_SECRET_VALUE}"
          CRON_SECRET="${CRON_SECRET_VALUE}"
          MFA_ENCRYPTION_KEY="${MFA_KEY_VALUE}"
          SUPER_ADMIN_EMAILS="@superadmin.test.local"
          EOF

      # Garde-fou strict : extrait uniquement l'hôte et le nom de base de DATABASE_URL (jamais
      # les identifiants, jamais l'URL complète) et exige une correspondance EXACTE — hôte
      # localhost/127.0.0.1 et base nommée exactement "xrent_test", pas un préfixe ni un motif
      # approché. Même exigence de correspondance exacte que
      # scripts/env-guard.js:assertDatabaseMatchesEnv. Le job échoue immédiatement si la cible
      # ne correspond pas.
      - name: "Guard: DATABASE_URL must target localhost/xrent_test exactly"
        run: |
          set -a; source .env.test; set +a
          if [[ "$DATABASE_URL" =~ ^postgresql://[^@]+@([^:/]+):([0-9]+)/([^?]+)(\?.*)?$ ]]; then
            db_host="${BASH_REMATCH[1]}"
            db_name="${BASH_REMATCH[3]}"
          else
            echo "Garde-fou : DATABASE_URL malformée (motif inattendu). Abandon." >&2
            exit 1
          fi
          if [[ "$db_host" != "localhost" && "$db_host" != "127.0.0.1" ]]; then
            echo "Garde-fou : hôte '$db_host' non autorisé (localhost/127.0.0.1 uniquement). Abandon." >&2
            exit 1
          fi
          if [[ "$db_name" != "xrent_test" ]]; then
            echo "Garde-fou : base '$db_name' non autorisée (exactement 'xrent_test' attendu). Abandon." >&2
            exit 1
          fi
          echo "Garde-fou OK : hôte '$db_host', base '$db_name' — aucune autre donnée affichée."

      # `npm run test` (vitest run) charge .env.test lui-même via le mécanisme officiel du
      # projet (vitest.config.mts: loadEnv(mode, cwd, "") ; vitest.global-setup.ts:
      # loadDotenv({ path: ".env.test" })) — aucune variable n'a besoin d'être exportée pour cette
      # étape. `prisma generate`, `prisma migrate deploy` et `next build`, en revanche, n'utilisent
      # pas ce mécanisme Vitest : cette étape leur rend disponibles les MÊMES valeurs, lues depuis
      # le même fichier .env.test généré ci-dessus (source unique).
      - name: Export .env.test to job environment (for generate/migrate/build only)
        run: |
          set -a; source .env.test; set +a
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "AUTH_SECRET=${AUTH_SECRET}"
            echo "CRON_SECRET=${CRON_SECRET}"
            echo "MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}"
          } >> "$GITHUB_ENV"

      # Placée après la création/export de .env.test : DATABASE_URL est donc déjà résolue et
      # validée par le garde-fou ci-dessus au moment où Prisma lit le schéma.
      - name: Generate Prisma client
        run: npx prisma generate

      # Applique uniquement les migrations déjà versionnées dans prisma/migrations/ (vérifié :
      # aucune ne contient DROP/TRUNCATE). Jamais `migrate reset`, jamais `db push --force-reset`.
      - name: Apply database migrations (xrent_test only)
        run: npx prisma migrate deploy

      # `verifyGroupsMatchDirectory()` (scripts/test-grouped.mjs) s'exécute ici de façon
      # inconditionnelle, y compris en mode `--group=N` : chaque entrée de la matrice relit
      # donc indépendamment src/__tests__/ et échoue si GROUPS a dérivé du contenu réel du
      # dossier. Coût négligeable (un seul readdir), exécuté six fois au total sur ce workflow
      # (une fois par groupe) plutôt qu'une seule fois de façon centralisée — accepté
      # délibérément : chaque job tourne sur un runner isolé sans état partagé, ce garde-fou
      # protège justement contre toute dérive silencieuse, indépendamment de l'entrée de
      # matrice qui l'exécute.
      - name: "Test — groupe ${{ matrix.group }}"
        run: node scripts/test-grouped.mjs --group=${{ matrix.group }}

      # `always()` : documenté par GitHub Actions comme s'exécutant même après annulation du
      # job (timeout-minutes inclus). Non garanti si le runner devient totalement injoignable
      # pendant la fenêtre de grâce d'annulation (déjà observé deux fois : logs natifs eux-mêmes
      # non persistés dans ce cas, voir run 33671092839) — cette étape réduit ce risque sans
      # l'éliminer. Portée désormais limitée au SEUL groupe concerné : si cette fenêtre de grâce
      # affecte l'upload du groupe en cause, les cinq autres groupes (jobs indépendants, chacun
      # avec son propre `if: always()`) ne sont jamais concernés. N'exige aucune permission
      # supplémentaire au-delà de `contents: read` déjà déclaré (upload-artifact utilise le
      # jeton d'exécution fourni par le runner, pas les scopes GITHUB_TOKEN classiques). Nom
      # d'artefact et chemin paramétrés par `matrix.group` : unique par groupe, jamais de
      # collision entre les six uploads simultanés d'un même run. Chemin relatif à la racine du
      # workspace (`GITHUB_WORKSPACE`), identique à celui écrit par
      # scripts/test-grouped.mjs (HEARTBEAT_FILE = join(__dirname, "..", ...)).
      - name: Upload test heartbeat log (best-effort, even if Test is cancelled)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-heartbeat-group-${{ matrix.group }}
          path: test-grouped-heartbeat-group-${{ matrix.group }}.log
          if-no-files-found: ignore
          retention-days: 5

      # DIAGNOSTIC TEMPORAIRE — voir src/lib/route-guards.ts et src/proxy.ts pour le contexte
      # complet. À supprimer avec le reste de cette instrumentation (ce step inclus) après
      # analyse du run. Seul le Groupe 2 (dashboard-route-guards.test.ts) produit ce fichier ;
      # les cinq autres groupes n'empruntent aucune des trois routes surveillées —
      # `if-no-files-found: ignore` évite tout échec pour eux. Nom d'artefact paramétré par
      # `matrix.group`, comme l'artefact heartbeat existant : unique par groupe, donc unique
      # pour le Groupe 2 en particulier. Rétention courte (5 jours) : purement diagnostique,
      # jamais destiné à être conservé.
      - name: "[DIAGNOSTIC TEMPORAIRE] Upload route-guard-diag log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-guard-diag-group-${{ matrix.group }}
          path: route-guard-diag.log
          if-no-files-found: ignore
          retention-days: 5

      # DIAGNOSTIC TEMPORAIRE — nettoyage best-effort du fichier local une fois uploadé (il
      # n'est de toute façon jamais commité — aucune étape de ce workflow n'exécute `git add`/
      # `git commit` — mais le runner ne persiste pas entre jobs, donc ce nettoyage n'a d'autre
      # rôle qu'une hygiène défensive du workspace pendant le job lui-même). `if: always()` +
      # `rm -f` (jamais d'échec si le fichier est absent) : ne modifie jamais la conclusion du
      # job, déjà déterminée par l'étape de test précédente — ce step ne peut jamais masquer un
      # échec de test.
      - name: "[DIAGNOSTIC TEMPORAIRE] Clean up route-guard-diag.log"
        if: always()
        run: rm -f route-guard-diag.log

      # DIAGNOSTIC TEMPORAIRE — voir vitest.global-setup.ts pour le contexte complet. À
      # supprimer avec le reste de cette instrumentation (ce step inclus) après analyse du
      # prochain échec de redémarrage. Produit par CHAQUE groupe (le serveur démarre au moins
      # une fois par groupe, redémarrage ou non) — if-no-files-found: ignore reste une
      # protection défensive, pas une attente de fichier absent dans le cas normal.
      - name: "[DIAGNOSTIC TEMPORAIRE] Upload next-server-diag log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-server-diag-group-${{ matrix.group }}
          path: next-server-diag.log
          if-no-files-found: ignore
          retention-days: 5

      # DIAGNOSTIC TEMPORAIRE — nettoyage best-effort, même principe et mêmes garanties que le
      # nettoyage route-guard-diag.log déjà en place ci-dessus : ne peut jamais masquer un
      # échec de test (if: always(), rm -f jamais en erreur si le fichier est absent).
      - name: "[DIAGNOSTIC TEMPORAIRE] Clean up next-server-diag.log"
        if: always()
        run: rm -f next-server-diag.log
